name: llm-from-scratch-notes

on:
  push:
    branches: [main]
    paths:
      - "llm-from-scratch-notes/**"
      - ".github/workflows/llm-from-scratch-notes.yml"
  pull_request:
    paths:
      - "llm-from-scratch-notes/**"
      - ".github/workflows/llm-from-scratch-notes.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-from-scratch-notes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt
      - name: Run tests
        run: pytest -q
      - name: Run Day2 / Day5 experiments (smoke test)
        run: |
          python day2/experiment.py > /dev/null
          python day5/experiment.py > /dev/null
