name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint CloudFormation
        run: cfn-lint infra/cloudformation/*.yaml
      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Unit tests + local pipeline smoke test (fixtures)
        run: pytest -q
